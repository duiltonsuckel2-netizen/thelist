<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e1c789"/>
      <stop offset="50%" stop-color="#c4a35a"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
  </defs>

  <!-- Maskable: o conteúdo importante fica dentro do "safe zone" central (40% do tamanho) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Monograma central, menor pra caber na safe zone -->
  <text x="256" y="320" font-family="Playfair Display, Georgia, serif"
        font-size="180" font-style="italic" font-weight="500"
        fill="url(#gold)" text-anchor="middle">M</text>
</svg>
