<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e1c789"/>
      <stop offset="50%" stop-color="#c4a35a"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Borda dourada sutil -->
  <rect x="8" y="8" width="496" height="496" rx="0" fill="none"
        stroke="url(#gold)" stroke-width="2" opacity="0.35"/>

  <!-- Ornamento estrela superior -->
  <text x="256" y="128" font-family="Georgia, serif" font-size="40"
        fill="url(#gold)" text-anchor="middle" opacity="0.85">✦</text>

  <!-- Monograma ML em Playfair-style -->
  <text x="256" y="320" font-family="Playfair Display, Georgia, serif"
        font-size="220" font-style="italic" font-weight="500"
        fill="url(#gold)" text-anchor="middle" filter="url(#glow)">M</text>

  <!-- Linha decorativa -->
  <line x1="176" y1="370" x2="336" y2="370" stroke="url(#gold)"
        stroke-width="1.5" opacity="0.6"/>

  <!-- Subtítulo -->
  <text x="256" y="410" font-family="DM Sans, system-ui, sans-serif"
        font-size="22" letter-spacing="6" fill="#b0a99f"
        text-anchor="middle" opacity="0.85">FLORIPA</text>
</svg>
